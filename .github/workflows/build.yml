# 多环境构建与部署工作流
name: Build and Deploy

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      # 检出Git仓库
      - name: Check out git repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      # 安装Node.js (不使用npm缓存，因为我们用pnpm)
      - name: Install Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: "18.x"
          # 移除npm缓存配置，避免寻找npm锁文件

      # 安装pnpm
      - name: Install pnpm
        run: |
          npm install -g pnpm@latest
          pnpm --version  # 验证安装成功
        shell: bash

      # 配置pnpm缓存
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 验证pnpm和锁文件
      - name: Verify environment
        run: |
          echo "PNPM version: $(pnpm --version)"
          echo "Checking for pnpm lock file:"
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pnpm-lock.yaml found"
          else
            echo "Error: pnpm-lock.yaml not found"
            exit 1
          fi
        shell: bash

      # 准备环境变量
      - name: Prepare environment variables
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Copied .env.example to .env"
            else
              echo "Warning: .env.example not found, creating empty .env"
              touch .env
            fi
          else
            echo ".env file already exists, skipping copy"
          fi

      # 安装项目依赖
      - name: Install dependencies
        run: pnpm install
        env:
          NODE_ENV: development

      # 代码检查
      - name: Lint code
        run: pnpm lint || echo "Lint warnings found but continuing build"

      # 构建项目
      - name: Build website
        run: pnpm build
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      # 上传构建产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: home-build-${{ github.sha }}
          path: dist/

      - name: Deploy to preview
        run: |
          echo "Deploying preview build to staging environment"
          # 添加实际部署命令

  deploy-production:
    name: Deploy Production
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: home-build-${{ github.sha }}
          path: dist/

      - name: Deploy to production
        run: |
          echo "Deploying production build"
          # 添加实际部署命令
