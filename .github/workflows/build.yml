# 多环境构建与部署工作流
name: Build and Deploy

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    env:
      # 开启详细日志模式
      DEBUG: true
      NODE_ENV: production

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Show runner environment info
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Node.js version: $(node -v || true)"
          echo "npm version: $(npm -v || true)"
          echo "pnpm version: $(pnpm -v || true)"
          echo "Current directory: $(pwd)"
          echo "Directory contents: $(ls -la)"
        shell: bash

      - name: Install Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: "18.x"

      - name: Install pnpm
        run: |
          echo "Installing pnpm..."
          npm install -g pnpm@latest
          echo "pnpm installed. Version: $(pnpm --version)"
        shell: bash
        continue-on-error: false  # 安装失败直接终止

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Verify project files
        run: |
          echo "Checking critical files..."
          [ -f "package.json" ] && echo "package.json exists" || { echo "Error: package.json missing"; exit 1; }
          [ -f "pnpm-lock.yaml" ] && echo "pnpm-lock.yaml exists" || { echo "Error: pnpm-lock.yaml missing"; exit 1; }
          echo "package.json contents: $(cat package.json | jq '.scripts')"  # 显示关键脚本配置
        shell: bash
        continue-on-error: false

      - name: Prepare environment variables
        run: |
          echo "Preparing .env file..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env && echo "Copied .env.example to .env"
            else
              echo "Warning: .env.example not found, creating empty .env"
              touch .env
            fi
          fi
          echo "Env file contents (sanitized):"
          grep -v -E 'API_KEY|TOKEN|PASSWORD' .env || true  # 隐藏敏感信息
        shell: bash

      - name: Install dependencies (with debug)
        run: |
          echo "Installing dependencies..."
          pnpm install --verbose  # 详细输出安装过程
        shell: bash
        continue-on-error: false  # 依赖安装失败终止

      - name: Lint code (with error details)
        run: |
          echo "Running lint..."
          if ! pnpm lint; then
            echo "Lint failed. Detailed output:"
            pnpm lint -- --debug  # 输出详细错误
            echo "Continuing build despite lint errors"  # 暂时忽略lint错误继续构建
          fi
        shell: bash
        continue-on-error: true  # 允许lint失败继续执行

      - name: Build website (with debug)
        run: |
          echo "Starting build..."
          echo "Node.js version: $(node -v)"
          echo "Build command: pnpm build"
          pnpm build --debug  # 构建时输出调试信息
        shell: bash
        continue-on-error: false  # 构建失败终止

      - name: Verify build output
        run: |
          echo "Checking build output..."
          [ -d "dist" ] && echo "dist directory exists" || { echo "Error: dist directory missing after build"; exit 1; }
          echo "dist directory contents: $(ls -la dist)"
        shell: bash
        continue-on-error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # 部署步骤保持不变
  deploy-preview:
    name: Deploy Preview
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: home-build-${{ github.sha }}
          path: dist/

      - name: Deploy to preview
        run: echo "Deploying preview build"

  deploy-production:
    name: Deploy Production
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: home-build-${{ github.sha }}
          path: dist/

      - name: Deploy to production
        run: echo "Deploying production build"
